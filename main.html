<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Library</title>

<style>
    body {
        background-color: #f8f8f8;
        margin: 0;
        font-family: Arial, sans-serif;
    }

    h1 {
        text-align: center;
    }

    .book-library {
        background-color: #ffffff;
        width: 90%;
        margin: auto;
        padding: 20px;
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .book {
        width: 200px;
        text-align: center;
        padding: 10px;
    }

    .book img {
        width: 100%;
        height: 280px;
        object-fit: cover;
    }

    .book h2 {
        font-size: 16px;
        margin: 10px 0 5px;
    }

    .book p {
        color: #777777;
        margin: 5px 0;
    }

    .price {
        background-color: #2ecc71;
        color: white;
        border-radius: 5px;
        padding: 8px;
        display: inline-block;
        margin-top: 5px;
    }
</style>

</head>

<body>

<h1>Book Library</h1>

<div class="book-library">

    <div class="book">
        <img src="https://m.media-amazon.com/images/I/81vpsIs58WL.jpg" alt="Spy in the Amber">
        <h2>Spy in the Amber</h2>
        <p>by Roger Zelazny</p>
        <div class="price">Rs. 299</div>
    </div>

    <div class="book">
        <img src="https://m.media-amazon.com/images/I/91lvxd9i5NL.jpg" alt="Sacred Games">
        <h2>Sacred Games</h2>
        <p>by Vikram Chandra</p>
        <div class="price">Rs. 499</div>
    </div>

    <div class="book">
        <img src="https://m.media-amazon.com/images/I/71M1KcuWc-L.jpg" alt="Byomkesh Bakshi">
        <h2>Byomkesh Bakshi</h2>
        <p>by Sharadindu Bandyopadhyay</p>
        <div class="price">Rs. 399</div>
    </div>

</div>

</body>
</html>
