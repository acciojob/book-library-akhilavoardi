<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Library</title>
    <style>
        body {
            background-color: #f8f8f8;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .book-library {
            background-color: #ffffff;
            max-width: 1000px;
            margin: auto;
            padding: 20px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .book {
            width: 220px;
            text-align: center;
            background-color: #fdfdfd;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .book img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .book h3 {
            margin: 12px 0 8px;
        }

        .author {
            color: #777777;
            margin-bottom: 10px;
        }

        .price-block {
            background-color: #2ecc71;
            color: white;
            padding: 10px;
            font-weight: bold;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="book-library">

        <div class="book">
            <img src="https://m.media-amazon.com/images/I/81vpsIs58WL.jpg" alt="Spy in the Amber">
            <h3>Spy in the Amber</h3>
            <p class="author">by Roger Zelazny</p>
            <div class="price-block">Rs. 299</div>
        </div>

        <div class="book">
            <img src="https://m.media-amazon.com/images/I/91lvxd9i5NL.jpg" alt="Sacred Games">
            <h3>Sacred Games</h3>
            <p class="author">by Vikram Chandra</p>
            <div class="price-block">Rs. 499</div>
        </div>

        <div class="book">
            <img src="https://m.media-amazon.com/images/I/71M1KcuWc-L.jpg" alt="Byomkesh Bakshi">
            <h3>Byomkesh Bakshi</h3>
            <p class="author">by Sharadindu Bandyopadhyay</p>
            <div class="price-block">Rs. 399</div>
        </div>

    </div>
</body>
</html>
